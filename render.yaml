services:
  - type: web
    name: aiml-knowledge-rag-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: LOW_MEMORY_MODE
        value: "false"
      - key: EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-MiniLM-L3-v2
      - key: MAX_CONTEXT_CHARS
        value: "5000"
      - key: TOP_K
        value: "3"
      - key: SIMILARITY_THRESHOLD
        value: "0.6"
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000
